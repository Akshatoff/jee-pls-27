<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEE Ultimate Prep Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .checkbox-custom { 
            accent-color: #4f46e5; 
            width: 1.25rem; 
            height: 1.25rem; 
            cursor: pointer; 
            transition: all 0.2s; 
        }
        .tab-active { 
            border-bottom: 2px solid #4f46e5; 
            color: #4f46e5; 
            font-weight: 600; 
        }
        .progress-stripe { 
            background-image: linear-gradient(45deg,rgba(255,255,255,.15) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.15) 75%,transparent 75%,transparent); 
            background-size: 1rem 1rem; 
        }
        /* Toast Animation */
        @keyframes slideInUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-enter {
            animation: slideInUp 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col relative overflow-x-hidden">

    <header class="bg-white shadow-sm sticky top-0 z-20">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
                    <div class="flex items-center gap-3">
                        <div class="bg-indigo-600 p-2 rounded-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                            </svg>
                        </div>
                        <h1 class="text-2xl font-extrabold text-gray-900 tracking-tight">JEE Tracker</h1>
                    </div>
                    
                    <!-- Export / Import Sync Actions -->
                    <div class="flex space-x-2 md:ml-6">
                        <button onclick="exportData()" class="px-3 py-1.5 bg-blue-50 text-blue-700 hover:bg-blue-100 border border-blue-200 rounded-md text-xs font-bold transition-colors flex items-center shadow-sm">
                            <svg class="w-3.5 h-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            Export
                        </button>
                        <label class="px-3 py-1.5 bg-purple-50 text-purple-700 hover:bg-purple-100 border border-purple-200 rounded-md text-xs font-bold transition-colors flex items-center cursor-pointer shadow-sm">
                            <svg class="w-3.5 h-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                            Import
                            <input type="file" accept=".json" class="hidden" onchange="importData(event)">
                        </label>
                    </div>
                </div>
                
                <div class="flex gap-4 items-center w-full md:w-auto">
                    <div class="flex-grow md:w-48 hidden lg:block">
                        <div class="flex justify-between text-xs font-bold mb-1 text-gray-500 uppercase tracking-wide">
                            <span>Completion</span>
                            <span id="overall-progress-text" class="text-indigo-600">0%</span>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-2 shadow-inner overflow-hidden">
                            <div id="overall-progress-bar" class="bg-indigo-600 h-2 rounded-full transition-all duration-700 ease-out progress-stripe" style="width: 0%"></div>
                        </div>
                    </div>
                    <button onclick="suggestNextChapter()" class="w-full md:w-auto bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold py-2.5 px-4 rounded-lg shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5 text-sm whitespace-nowrap flex items-center justify-center gap-2">
                        <span>🎯 Suggest Next</span>
                    </button>
                </div>
            </div>
        </div>
        
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-2 border-t border-gray-100 pt-2">
            <nav class="flex overflow-x-auto space-x-8 pb-1 scrollbar-hide" aria-label="Tabs" id="tabs-container">
                <button onclick="switchTab('Physics')" id="tab-Physics" class="tab-active py-2 px-1 text-sm font-medium transition-colors hover:text-indigo-600 whitespace-nowrap">Physics</button>
                <button onclick="switchTab('Chemistry')" id="tab-Chemistry" class="text-gray-500 hover:text-gray-700 py-2 px-1 text-sm font-medium transition-colors border-b-2 border-transparent hover:border-gray-300 whitespace-nowrap">Chemistry</button>
                <button onclick="switchTab('Mathematics')" id="tab-Mathematics" class="text-gray-500 hover:text-gray-700 py-2 px-1 text-sm font-medium transition-colors border-b-2 border-transparent hover:border-gray-300 whitespace-nowrap">Mathematics</button>
                <button onclick="switchTab('Daily')" id="tab-Daily" class="text-gray-500 hover:text-gray-700 py-2 px-1 text-sm font-medium transition-colors border-b-2 border-transparent hover:border-gray-300 whitespace-nowrap flex items-center gap-1">
                    <span>📅 Daily System</span>
                </button>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8 sm:px-6 lg:px-8">
        <div id="content-Physics" class="subject-content hidden"></div>
        <div id="content-Chemistry" class="subject-content hidden"></div>
        <div id="content-Mathematics" class="subject-content hidden"></div>
        <div id="content-Daily" class="subject-content hidden"></div>
    </main>

    <!-- Suggestion Modal -->
    <div id="suggestion-modal" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="fixed inset-0 bg-gray-900 bg-opacity-75 backdrop-blur-sm transition-opacity"></div>
        <div class="fixed inset-0 z-10 overflow-y-auto">
            <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
                <div class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-lg border border-gray-100">
                    <div class="bg-white px-4 pb-4 pt-5 sm:p-6 sm:pb-4">
                        <div class="sm:flex sm:items-start">
                            <div class="mx-auto flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-full bg-indigo-100 sm:mx-0 sm:h-10 sm:w-10">
                                🎯
                            </div>
                            <div class="mt-3 text-center sm:ml-4 sm:mt-0 sm:text-left w-full">
                                <h3 class="text-lg font-bold leading-6 text-gray-900" id="modal-title">Recommended Next Target</h3>
                                <div class="mt-4 bg-gray-50 p-4 rounded-xl border border-gray-100">
                                    <div class="flex items-center gap-2 mb-2">
                                        <span id="modal-priority-badge" class="px-2.5 py-0.5 rounded text-xs font-bold shadow-sm"></span>
                                        <span id="modal-subject" class="text-xs font-semibold text-gray-500 uppercase"></span>
                                    </div>
                                    <p id="modal-chapter-name" class="text-xl font-bold text-gray-800"></p>
                                    <div class="mt-3">
                                        <p class="text-sm text-gray-600 font-medium mb-1">Missing Tasks:</p>
                                        <div id="modal-missing-tasks" class="flex flex-wrap gap-2"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
                        <button type="button" onclick="goToSuggestedChapter()" class="inline-flex w-full justify-center rounded-lg bg-indigo-600 px-6 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 sm:ml-3 sm:w-auto transition-colors">Let's go!</button>
                        <button type="button" onclick="closeModal()" class="mt-3 inline-flex w-full justify-center rounded-lg bg-white px-6 py-2.5 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 sm:mt-0 sm:w-auto transition-colors">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Toast Notification System -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <script>
        const STORAGE_KEY = 'jee_ultimate_tracker_sync_v1';

        // Custom Notification Function replacing standard alert()
        function showNotification(title, message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const colors = type === 'success' ? 'bg-green-50 border-green-200 text-green-800' : 
                           type === 'error' ? 'bg-red-50 border-red-200 text-red-800' : 
                           'bg-blue-50 border-blue-200 text-blue-800';
                           
            const icon = type === 'success' ? `<svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>` : 
                         type === 'error' ? `<svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>` : 
                         `<svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;

            toast.className = `flex items-start p-4 mb-2 border rounded-xl shadow-lg pointer-events-auto ${colors} toast-enter w-72`;
            toast.innerHTML = `
                <div class="flex-shrink-0 mt-0.5">${icon}</div>
                <div class="ml-3 w-0 flex-1">
                    <p class="text-sm font-bold">${title}</p>
                    <p class="mt-1 text-xs opacity-90">${message}</p>
                </div>
            `;
            
            container.appendChild(toast);
            
            // Auto remove after 3.5 seconds
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all 0.3s ease-out';
                setTimeout(() => { if(toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
            }, 3500);
        }

        const tasks = ['Lecture', 'Module', 'DPP', 'PYQs', 'Revision'];
        const prioritiesOrder = ['P1', 'P2', 'P3']; 
        
        const priorityMeta = {
            'P1': { label: '🔴 P1 — Must Master', colors: 'bg-red-50 text-red-700 border-red-200', bar: 'bg-red-500' },
            'P2': { label: '🟠 P2 — High Priority', colors: 'bg-orange-50 text-orange-700 border-orange-200', bar: 'bg-orange-500' },
            'P3': { label: '🟡 P3 — Complete After', colors: 'bg-yellow-50 text-yellow-700 border-yellow-200', bar: 'bg-yellow-500' }
        };

        const syllabus = {
            'Physics': {
                'P1': ['Current Electricity', 'Electrostatics', 'Ray Optics', 'Modern Physics', 'Semiconductors', 'Moving Charges & Magnetism', 'EMI', 'AC', 'NLM', 'WEP', 'Rotation'],
                'P2': ['Kinematics', 'Thermodynamics', 'SHM', 'Waves', 'Gravitation', 'COM/Collision', 'Fluids', 'Wave Optics', 'Units/Dimensions/Errors', 'KTG', 'Thermal Properties'],
                'P3': ['Magnetism & Matter', 'EM Waves', 'Mechanical Properties of Solids', 'Elasticity', 'Experimental Physics']
            },
            'Chemistry': {
                'P1': ['Mole Concept', 'Chemical Bonding', 'GOC', 'Thermodynamics', 'Electrochemistry', 'Chemical Equilibrium', 'Ionic Equilibrium', 'Coordination Compounds', 'Carbonyl Compounds', 'Amines', 'Hydrocarbons'],
                'P2': ['Solutions', 'Chemical Kinetics', 'Haloalkanes/Haloarenes', 'Alcohols/Phenols/Ethers', 'Periodic Table', 'p-Block', 'd/f Block', 'Atomic Structure', 'Redox'],
                'P3': ['Biomolecules', 'Qualitative Analysis', 'Practical Chemistry']
            },
            'Mathematics': {
                'P1': ['Quadratic Equations', 'Sequence & Series', 'Matrices', 'Determinants', 'Straight Lines', 'Circle', 'Vector Algebra', '3D Geometry', 'Limits', 'Continuity & Differentiability', 'Application of Derivatives', 'Integration', 'Differential Equations', 'Probability'],
                'P2': ['Functions', 'Trigonometry', 'Complex Numbers', 'P&C', 'Binomial', 'Statistics', 'Parabola', 'Ellipse', 'Hyperbola', 'Area Under Curves'],
                'P3': ['Sets & Relations', 'Inverse Trigonometry', 'Linear Programming']
            }
        };

        const defaultDailyTasks = ['Solve 50 PYQs', 'Revise Short Notes', 'Read NCERT 30 mins', 'Mock Test / Analysis'];

        let appState = {
            progress: {},
            daily: {
                lastDate: new Date().toLocaleDateString(),
                tasks: {}
            }
        };
        
        let currentSuggestion = null;

        function getEmptyState() {
            let state = { progress: {}, daily: { lastDate: new Date().toLocaleDateString(), tasks: {} } };
            for (const subj in syllabus) {
                state.progress[subj] = {};
                for (const prio in syllabus[subj]) {
                    syllabus[subj][prio].forEach(chap => {
                        state.progress[subj][chap] = {};
                        tasks.forEach(t => state.progress[subj][chap][t] = false);
                    });
                }
            }
            defaultDailyTasks.forEach(task => { state.daily.tasks[task] = false; });
            return state;
        }

        function initApp() {
            loadData();
            renderAll();
        }

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            appState = getEmptyState(); 
            
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    // Merge progress gracefully
                    if (data.progress) {
                        for (const s in data.progress) {
                            if (!appState.progress[s]) continue;
                            for (const c in data.progress[s]) {
                                if (!appState.progress[s][c]) continue;
                                for (const t in data.progress[s][c]) {
                                    appState.progress[s][c][t] = !!data.progress[s][c][t];
                                }
                            }
                        }
                    }

                    // Handle Daily system resets based on current date
                    if (data.daily) {
                        const today = new Date().toLocaleDateString();
                        if (data.daily.lastDate === today) {
                            appState.daily.lastDate = data.daily.lastDate;
                            if (data.daily.tasks) {
                                for (const dt in data.daily.tasks) {
                                    if (appState.daily.tasks[dt] !== undefined) {
                                        appState.daily.tasks[dt] = data.daily.tasks[dt];
                                    }
                                }
                            }
                        } else {
                            // Date changed, reset daily tasks
                            appState.daily.lastDate = today;
                            saveData(); 
                        }
                    }
                } catch (e) {
                    console.error("Data loading error, resetting to default.", e);
                }
            }
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
            } catch (err) { 
                console.error("Save error:", err); 
            }
        }

        // Feature: Zero-Backend Export Sync
        window.exportData = function() {
            try {
                const data = JSON.stringify(appState);
                const blob = new Blob([data], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `JEE_Tracker_Backup_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                showNotification("Export Successful", "Your progress backup has been downloaded.");
            } catch (error) {
                showNotification("Export Failed", "Could not create backup file.", "error");
            }
        };

        // Feature: Zero-Backend Import Sync
        window.importData = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    
                    if (importedData.progress && importedData.daily) {
                        appState = importedData;
                        saveData();
                        loadData(); // Re-validate data structures
                        renderAll();
                        showNotification("Import Successful", "Your progress has been synced from the file!");
                    } else {
                        throw new Error("Invalid format");
                    }
                } catch (error) {
                    showNotification("Import Failed", "Please ensure you selected a valid JEE Tracker backup JSON file.", "error");
                    console.error(error);
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // Reset input
        };

        function calculateStats() {
            let total = 0, done = 0;
            for (const s in syllabus) {
                for (const p in syllabus[s]) {
                    syllabus[s][p].forEach(c => {
                        tasks.forEach(t => {
                            total++;
                            if (appState.progress[s] && appState.progress[s][c] && appState.progress[s][c][t]) done++;
                        });
                    });
                }
            }
            return { total, done, pct: total > 0 ? Math.round((done/total)*100) : 0 };
        }

        function renderAll() {
            const stats = calculateStats();
            document.getElementById('overall-progress-bar').style.width = `${stats.pct}%`;
            document.getElementById('overall-progress-text').textContent = `${stats.pct}%`;

            ['Physics', 'Chemistry', 'Mathematics'].forEach(renderSubject);
            renderDaily();
            switchTab('Physics'); 
        }

        function getChapterProgress(subj, chap) {
            let chDone = 0;
            tasks.forEach(t => { if(appState.progress[subj][chap][t]) chDone++; });
            return chDone;
        }
        
        function getSafeId(name) {
            return name.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase();
        }

        function renderSubject(subj) {
            const container = document.getElementById(`content-${subj}`);
            let html = `<div class="mb-8"><h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">${subj}</h2></div>`;
            
            html += `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">`;

            prioritiesOrder.forEach(prio => {
                if (!syllabus[subj][prio]) return;
                
                syllabus[subj][prio].forEach(chap => {
                    const meta = priorityMeta[prio];
                    const chDone = getChapterProgress(subj, chap);
                    const chPct = Math.round((chDone / tasks.length) * 100);
                    const isComplete = chDone === tasks.length;
                    const cardBg = isComplete ? 'bg-indigo-50 border-indigo-200' : 'bg-white border-gray-200 hover:border-indigo-300 hover:shadow-md';
                    const safeId = `card-${getSafeId(subj)}-${getSafeId(chap)}`;

                    let tasksHtml = '';
                    tasks.forEach(t => {
                        const checked = appState.progress[subj][chap][t] ? 'checked' : '';
                        tasksHtml += `
                            <label class="flex items-center gap-2.5 p-1.5 hover:bg-gray-100 rounded-md cursor-pointer group transition-colors">
                                <input type="checkbox" class="checkbox-custom rounded" ${checked} onchange="toggleTask('${subj}','${chap}','${t}',this)">
                                <span class="text-sm font-medium text-gray-600 group-hover:text-gray-900 ${checked ? 'line-through opacity-60' : ''}">${t}</span>
                            </label>
                        `;
                    });

                    html += `
                        <div id="${safeId}" class="${cardBg} rounded-2xl p-5 border transition-all duration-300 flex flex-col scroll-mt-24">
                            <div class="flex justify-between items-start mb-3 gap-2">
                                <h3 class="font-bold text-gray-900 text-lg leading-tight flex-grow">${chap}</h3>
                                <span class="whitespace-nowrap px-2 py-1 rounded text-[10px] font-bold uppercase tracking-wider border shadow-sm ${meta.colors}">${prio}</span>
                            </div>
                            
                            <div class="mb-4">
                                <div class="flex justify-between text-xs font-bold text-gray-500 mb-1">
                                    <span>Progress</span>
                                    <span class="chapter-progress-text">${chDone}/${tasks.length}</span>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-1.5 overflow-hidden">
                                    <div class="${meta.bar} h-1.5 rounded-full transition-all duration-500 chapter-progress-bar" style="width: ${chPct}%"></div>
                                </div>
                            </div>
                            
                            <div class="mt-auto grid grid-cols-2 gap-x-2 gap-y-1 pt-3 border-t border-gray-100">
                                ${tasksHtml}
                            </div>
                        </div>
                    `;
                });
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        function renderDaily() {
            const container = document.getElementById('content-Daily');
            
            let tasksHtml = '';
            let dDone = 0;
            const dTotal = Object.keys(appState.daily.tasks).length;

            for (const t in appState.daily.tasks) {
                const checked = appState.daily.tasks[t];
                if (checked) dDone++;
                
                tasksHtml += `
                    <label class="flex items-center p-4 bg-white border ${checked ? 'border-indigo-200 bg-indigo-50/30' : 'border-gray-200'} rounded-xl cursor-pointer hover:shadow-sm transition-all group mb-3">
                        <input type="checkbox" class="checkbox-custom rounded" ${checked ? 'checked' : ''} onchange="toggleDaily('${t}',this)">
                        <span class="ml-4 text-lg font-medium ${checked ? 'text-gray-400 line-through' : 'text-gray-700 group-hover:text-indigo-900'}">${t}</span>
                    </label>
                `;
            }

            container.innerHTML = `
                <div class="max-w-2xl mx-auto">
                    <div class="text-center mb-8">
                        <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight mb-2">Daily Consistency System</h2>
                        <p class="text-gray-500 font-medium bg-gray-100 inline-block px-3 py-1 rounded-full text-sm">Resets automatically at midnight. Today: ${appState.daily.lastDate}</p>
                    </div>
                    
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 mb-8">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-sm font-bold text-gray-500 uppercase">Today's Goals</span>
                            <span class="text-indigo-600 font-bold">${dDone}/${dTotal} Done</span>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-3 mb-6 overflow-hidden">
                            <div class="bg-indigo-500 h-3 rounded-full transition-all duration-500" style="width: ${(dDone/dTotal)*100}%"></div>
                        </div>
                        ${tasksHtml}
                    </div>
                </div>
            `;
        }

        window.toggleTask = function(subj, chap, task, el) {
            appState.progress[subj][chap][task] = el.checked;
            saveData();
            
            // DOM manipulation for instant feedback without full re-render
            const chDone = getChapterProgress(subj, chap);
            const card = el.closest('.rounded-2xl');
            const progressText = card.querySelector('.chapter-progress-text');
            const progressBar = card.querySelector('.chapter-progress-bar');
            const labelSpan = el.nextElementSibling;
            
            if (progressText) progressText.textContent = `${chDone}/${tasks.length}`;
            if (progressBar) progressBar.style.width = `${Math.round((chDone/tasks.length)*100)}%`;
            
            if(el.checked) {
                labelSpan.classList.add('line-through', 'opacity-60');
                if(chDone === tasks.length) {
                    card.classList.add('bg-indigo-50', 'border-indigo-200');
                    card.classList.remove('bg-white');
                }
            } else {
                labelSpan.classList.remove('line-through', 'opacity-60');
                card.classList.remove('bg-indigo-50', 'border-indigo-200');
                card.classList.add('bg-white');
            }

            const stats = calculateStats();
            document.getElementById('overall-progress-bar').style.width = `${stats.pct}%`;
            document.getElementById('overall-progress-text').textContent = `${stats.pct}%`;
        };

        window.toggleDaily = function(task, el) {
            appState.daily.tasks[task] = el.checked;
            saveData();
            renderDaily(); 
        };

        window.switchTab = function(tabName) {
            ['Physics', 'Chemistry', 'Mathematics', 'Daily'].forEach(tab => {
                const btn = document.getElementById(`tab-${tab}`);
                const content = document.getElementById(`content-${tab}`);
                
                if (tab === tabName) {
                    btn.classList.add('tab-active');
                    btn.classList.remove('text-gray-500', 'hover:text-gray-700', 'border-transparent', 'hover:border-gray-300');
                    content.classList.remove('hidden');
                } else {
                    btn.classList.remove('tab-active');
                    btn.classList.add('text-gray-500', 'hover:text-gray-700', 'border-transparent', 'hover:border-gray-300');
                    content.classList.add('hidden');
                }
            });
        };

        window.suggestNextChapter = function() {
            currentSuggestion = null;
            const subjects = ['Physics', 'Chemistry', 'Mathematics'];
            
            // Logic: Scan P1 first across all subjects, then P2, then P3
            for (const prio of prioritiesOrder) {
                for (const subj of subjects) {
                    if (!syllabus[subj][prio]) continue;
                    
                    for (const chap of syllabus[subj][prio]) {
                        const chDone = getChapterProgress(subj, chap);
                        if (chDone < tasks.length) {
                            const missing = tasks.filter(t => !appState.progress[subj][chap][t]);
                            currentSuggestion = { subj, prio, chap, missing };
                            break; 
                        }
                    }
                    if (currentSuggestion) break; 
                }
                if (currentSuggestion) break; 
            }

            if (currentSuggestion) {
                const meta = priorityMeta[currentSuggestion.prio];
                document.getElementById('modal-priority-badge').className = `px-2.5 py-0.5 rounded text-xs font-bold shadow-sm ${meta.colors}`;
                document.getElementById('modal-priority-badge').textContent = currentSuggestion.prio;
                document.getElementById('modal-subject').textContent = currentSuggestion.subj;
                document.getElementById('modal-chapter-name').textContent = currentSuggestion.chap;
                
                const missingHtml = currentSuggestion.missing.map(m => 
                    `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-semibold bg-gray-100 text-gray-700 border border-gray-200">
                        Pending: ${m}
                    </span>`
                ).join('');
                document.getElementById('modal-missing-tasks').innerHTML = missingHtml;
                
                document.getElementById('suggestion-modal').classList.remove('hidden');
            } else {
                showNotification("Incredible Job!", "You have completed the entire syllabus!", "success");
            }
        };
        
        window.goToSuggestedChapter = function() {
            if (!currentSuggestion) return;
            
            closeModal();
            switchTab(currentSuggestion.subj);
            
            // Small delay to allow tab render/display to complete before scrolling
            setTimeout(() => {
                const safeId = `card-${getSafeId(currentSuggestion.subj)}-${getSafeId(currentSuggestion.chap)}`;
                const cardElement = document.getElementById(safeId);
                if (cardElement) {
                    cardElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    // Highlight effect
                    cardElement.classList.add('ring-4', 'ring-indigo-300', 'shadow-xl');
                    setTimeout(() => {
                        cardElement.classList.remove('ring-4', 'ring-indigo-300', 'shadow-xl');
                    }, 2000);
                }
            }, 50);
        };

        window.closeModal = function() {
            document.getElementById('suggestion-modal').classList.add('hidden');
        };

        // Bootstrap application
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
