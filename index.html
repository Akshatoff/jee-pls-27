<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEE Ultimate Prep Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .checkbox-custom { accent-color: #4f46e5; width: 1.25rem; height: 1.25rem; cursor: pointer; transition: all 0.2s; }
        .tab-active { border-bottom: 2px solid #4f46e5; color: #4f46e5; font-weight: 600; }
        .progress-stripe { background-image: linear-gradient(45deg,rgba(255,255,255,.15) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.15) 75%,transparent 75%,transparent); background-size: 1rem 1rem; }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col relative">

    <header class="bg-white shadow-sm sticky top-0 z-20">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex flex-col md:flex-row items-center gap-3 w-full md:w-auto">
                    <div class="flex items-center gap-3">
                        <div class="bg-indigo-600 p-2 rounded-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                            </svg>
                        </div>
                        <h1 class="text-2xl font-extrabold text-gray-900 tracking-tight">JEE Tracker</h1>
                        <div id="sync-status" class="hidden ml-2 text-xs font-semibold px-2 py-1 rounded-md flex items-center gap-1 transition-all shadow-sm"></div>
                    </div>
                    
                    <div class="flex space-x-2 mt-3 md:mt-0 md:ml-4">
                        <button onclick="exportProgress()" class="px-3 py-1.5 bg-blue-50 text-blue-700 border border-blue-200 hover:bg-blue-100 rounded text-sm font-bold transition-colors">
                            Export JSON
                        </button>
                        <label class="px-3 py-1.5 bg-purple-50 text-purple-700 border border-purple-200 hover:bg-purple-100 rounded text-sm font-bold transition-colors cursor-pointer">
                            Import JSON
                            <input type="file" accept=".json" class="hidden" onchange="importProgress(event)">
                        </label>
                    </div>
                </div>
                
                <div class="flex gap-4 items-center w-full md:w-auto mt-2 md:mt-0">
                    <div class="flex-grow md:w-64">
                        <div class="flex justify-between text-xs font-bold mb-1 text-gray-500 uppercase tracking-wide">
                            <span>Total Completion</span>
                            <span id="overall-progress-text" class="text-indigo-600">0%</span>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-2.5 shadow-inner overflow-hidden">
                            <div id="overall-progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-700 ease-out progress-stripe" style="width: 0%"></div>
                        </div>
                    </div>
                    <button onclick="suggestNextChapter()" class="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold py-2 px-4 rounded-lg shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5 text-sm whitespace-nowrap flex items-center gap-2">
                        <span>🎯 Suggest Next</span>
                    </button>
                </div>
            </div>
        </div>
        
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-2 border-t border-gray-100 pt-2">
            <nav class="flex overflow-x-auto space-x-8 pb-1 scrollbar-hide" aria-label="Tabs" id="tabs-container">
                <button onclick="switchTab('Physics')" id="tab-Physics" class="tab-active py-2 px-1 text-sm font-medium transition-colors hover:text-indigo-600 whitespace-nowrap">Physics</button>
                <button onclick="switchTab('Chemistry')" id="tab-Chemistry" class="text-gray-500 hover:text-gray-700 py-2 px-1 text-sm font-medium transition-colors border-b-2 border-transparent hover:border-gray-300 whitespace-nowrap">Chemistry</button>
                <button onclick="switchTab('Mathematics')" id="tab-Mathematics" class="text-gray-500 hover:text-gray-700 py-2 px-1 text-sm font-medium transition-colors border-b-2 border-transparent hover:border-gray-300 whitespace-nowrap">Mathematics</button>
                <button onclick="switchTab('Daily')" id="tab-Daily" class="text-gray-500 hover:text-gray-700 py-2 px-1 text-sm font-medium transition-colors border-b-2 border-transparent hover:border-gray-300 whitespace-nowrap flex items-center gap-1">
                    <span>📅 Daily System</span>
                </button>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8 sm:px-6 lg:px-8">
        <div id="content-Physics" class="subject-content hidden"></div>
        <div id="content-Chemistry" class="subject-content hidden"></div>
        <div id="content-Mathematics" class="subject-content hidden"></div>
        <div id="content-Daily" class="subject-content hidden"></div>
    </main>

    <div id="suggestion-modal" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="fixed inset-0 bg-gray-900 bg-opacity-75 backdrop-blur-sm transition-opacity"></div>
        <div class="fixed inset-0 z-10 overflow-y-auto">
            <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
                <div class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-lg border border-gray-100">
                    <div class="bg-white px-4 pb-4 pt-5 sm:p-6 sm:pb-4">
                        <div class="sm:flex sm:items-start">
                            <div class="mx-auto flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-full bg-indigo-100 sm:mx-0 sm:h-10 sm:w-10">
                                🎯
                            </div>
                            <div class="mt-3 text-center sm:ml-4 sm:mt-0 sm:text-left w-full">
                                <h3 class="text-lg font-bold leading-6 text-gray-900" id="modal-title">Best Next Task</h3>
                                <div class="mt-4 bg-gray-50 p-4 rounded-xl border border-gray-100">
                                    <div class="flex items-center justify-between mb-2">
                                        <div class="flex items-center gap-2">
                                            <span id="modal-priority-badge" class="px-2.5 py-0.5 rounded text-xs font-bold shadow-sm"></span>
                                            <span id="modal-subject" class="text-xs font-semibold text-gray-500 uppercase"></span>
                                        </div>
                                        <div class="text-xs font-bold text-indigo-600 bg-indigo-100 px-2 py-1 rounded">
                                            Urgency Score: <span id="modal-score"></span>
                                        </div>
                                    </div>
                                    <p id="modal-chapter-name" class="text-xl font-bold text-gray-800"></p>
                                    <p id="modal-reason" class="mt-1 text-sm text-gray-600"></p>
                                    <div class="mt-3">
                                        <p class="text-sm text-gray-600 font-medium mb-1">Missing Completion Tasks:</p>
                                        <div id="modal-missing-tasks" class="flex flex-wrap gap-2"></div>
                                    </div>
                                </div>
                                <h4 class="mt-5 mb-2 text-xs font-bold uppercase tracking-wide text-gray-500">Subject recommendations</h4>
                                <div id="modal-subject-recs" class="space-y-2"></div>
                                <p class="mt-4 text-xs text-gray-500"><span id="modal-formula-note"></span></p>
                            </div>
                        </div>
                    </div>
                    <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
                        <button type="button" onclick="closeModal()" class="inline-flex w-full justify-center rounded-lg bg-indigo-600 px-6 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 sm:ml-3 sm:w-auto transition-colors">Let's go!</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'jee_ultimate_tracker_v3';
        let syncTimeout;

        // DPP Removed.
        const tasks = ['Lecture', 'Module', 'PYQs', 'Revision'];
        const prioritiesOrder = ['P1', 'P2', 'P3']; 
        
        const priorityMeta = {
            'P1': { label: '🔴 P1 — Must Master', colors: 'bg-red-50 text-red-700 border-red-200', bar: 'bg-red-500' },
            'P2': { label: '🟠 P2 — High Priority', colors: 'bg-orange-50 text-orange-700 border-orange-200', bar: 'bg-orange-500' },
            'P3': { label: '🟡 P3 — Complete After', colors: 'bg-yellow-50 text-yellow-700 border-yellow-200', bar: 'bg-yellow-500' }
        };

        // Filtered Syllabus based on latest requirements
        const syllabus = {
            'Physics': {
                'P1': ['Current Electricity', 'Electrostatics', 'Ray Optics', 'Modern Physics', 'Semiconductors', 'Moving Charges & Magnetism', 'EMI', 'AC', 'NLM', 'WEP', 'Rotation'],
                'P2': ['Kinematics', 'Thermodynamics', 'SHM', 'Waves', 'Gravitation', 'COM/Collision', 'Fluids', 'Wave Optics', 'Units/Dimensions/Errors', 'KTG', 'Thermal Properties'],
                'P3': ['Magnetism & Matter', 'EM Waves', 'Mechanical Properties of Solids', 'Elasticity', 'Experimental Physics', 'remaining smaller subtopics']
            },
            'Chemistry': {
                'P1': ['Mole Concept', 'Chemical Bonding', 'GOC', 'Thermodynamics', 'Electrochemistry', 'Chemical Equilibrium', 'Ionic Equilibrium', 'Coordination Compounds', 'Carbonyl Compounds', 'Amines', 'Hydrocarbons'],
                'P2': ['Solutions', 'Chemical Kinetics', 'Haloalkanes/Haloarenes', 'Alcohols/Phenols/Ethers', 'Periodic Table', 'p-Block', 'd/f Block', 'Atomic Structure', 'Redox'],
                'P3': ['Biomolecules', 'Qualitative Analysis', 'Practical Chemistry']
            },
            'Mathematics': {
                'P1': ['Quadratic Equations', 'Sequence & Series', 'Matrices', 'Determinants', 'Straight Lines', 'Circle', 'Vector Algebra', '3D Geometry', 'Limits', 'Continuity & Differentiability', 'Application of Derivatives', 'Integration', 'Differential Equations', 'Probability'],
                'P2': ['Functions', 'Trigonometry', 'Complex Numbers', 'P&C', 'Binomial', 'Statistics', 'Parabola', 'Ellipse', 'Hyperbola', 'Area Under Curves'],
                'P3': ['Sets & Relations', 'Inverse Trigonometry', 'Linear Programming']
            }
        };

        const defaultDailyTasks = ['Solve 50 PYQs', 'Revise Short Notes', 'Read NCERT 30 mins', 'Mock Test / Analysis'];

        let appState = {
            progress: {},
            daily: {
                lastDate: new Date().toLocaleDateString(),
                tasks: {}
            }
        };

        function getEmptyState() {
            let state = { progress: {}, daily: { lastDate: new Date().toLocaleDateString(), tasks: {} } };
            for (const subj in syllabus) {
                state.progress[subj] = {};
                for (const prio in syllabus[subj]) {
                    syllabus[subj][prio].forEach(chap => {
                        state.progress[subj][chap] = {};
                        tasks.forEach(t => state.progress[subj][chap][t] = false);
                    });
                }
            }
            defaultDailyTasks.forEach(task => { state.daily.tasks[task] = false; });
            return state;
        }

        function initApp() {
            loadData();
            renderAll();
        }

        function loadData() {
            try {
                showSyncStatus('Loading...', 'text-gray-500');
                const saved = localStorage.getItem(STORAGE_KEY);
                appState = getEmptyState(); 
                
                if (saved) {
                    const data = JSON.parse(saved);
                    if (data.progress) {
                        for (const s in data.progress) {
                            if (!appState.progress[s]) continue;
                            for (const c in data.progress[s]) {
                                if (!appState.progress[s][c]) continue;
                                for (const t in data.progress[s][c]) {
                                    // Handle cases where older tasks (like DPP) might be in old save data
                                    if(appState.progress[s][c][t] !== undefined) {
                                        appState.progress[s][c][t] = !!data.progress[s][c][t];
                                    }
                                }
                            }
                        }
                    }

                    if (data.daily) {
                        const today = new Date().toLocaleDateString();
                        if (data.daily.lastDate === today) {
                            appState.daily.lastDate = data.daily.lastDate;
                            if (data.daily.tasks) {
                                for (const dt in data.daily.tasks) {
                                    if (appState.daily.tasks[dt] !== undefined) {
                                        appState.daily.tasks[dt] = data.daily.tasks[dt];
                                    }
                                }
                            }
                        } else {
                            appState.daily.lastDate = today;
                            scheduleSave(); 
                        }
                    }
                }
                showSyncStatus('Loaded Locally', 'text-green-600');
                setTimeout(hideSyncStatus, 2500);
            } catch (err) {
                console.error(err);
                showSyncStatus('Load Error', 'text-red-500');
            }
        }

        function scheduleSave() {
            if (syncTimeout) clearTimeout(syncTimeout);
            showSyncStatus('Saving...', 'text-indigo-600', true);
            syncTimeout = setTimeout(saveData, 500);
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
                showSyncStatus('Saved Locally', 'text-green-600');
                setTimeout(hideSyncStatus, 2500);
            } catch (err) { 
                console.error("Save error:", err); 
                showSyncStatus('Save Failed', 'text-red-500');
            }
        }

        function exportProgress() {
            const data = localStorage.getItem(STORAGE_KEY) || JSON.stringify(appState);
            const blob = new Blob([data], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `JEE_Tracker_Backup_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importProgress(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(importedData));
                    alert("Progress imported successfully! The page will now reload.");
                    location.reload(); 
                } catch (error) {
                    alert("Error importing file. Please make sure it is a valid JSON backup file.");
                    console.error(error);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function showSyncStatus(msg, colorClass, spinner = false) {
            const el = document.getElementById('sync-status');
            if (el) {
                el.classList.remove('hidden');
                el.className = `ml-2 text-xs font-bold px-2.5 py-1 rounded-md flex items-center gap-1.5 transition-all ${colorClass} bg-white border border-gray-200 shadow-sm`;
                el.innerHTML = spinner 
                    ? `<svg class="animate-spin h-3.5 w-3.5 ${colorClass}" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> ${msg}`
                    : msg;
            }
        }

        function hideSyncStatus() {
            const el = document.getElementById('sync-status');
            if (el) el.classList.add('hidden');
        }

        function calculateStats() {
            let total = 0, done = 0;
            for (const s in syllabus) {
                for (const p in syllabus[s]) {
                    syllabus[s][p].forEach(c => {
                        tasks.forEach(t => {
                            total++;
                            if (appState.progress[s] && appState.progress[s][c] && appState.progress[s][c][t]) done++;
                        });
                    });
                }
            }
            return { total, done, pct: total > 0 ? Math.round((done/total)*100) : 0 };
        }

        function renderAll() {
            const stats = calculateStats();
            document.getElementById('overall-progress-bar').style.width = `${stats.pct}%`;
            document.getElementById('overall-progress-text').textContent = `${stats.pct}%`;

            ['Physics', 'Chemistry', 'Mathematics'].forEach(renderSubject);
            renderDaily();
            switchTab('Physics'); 
        }

        function getChapterProgress(subj, chap) {
            let chDone = 0;
            tasks.forEach(t => { if(appState.progress[subj][chap][t]) chDone++; });
            return chDone;
        }

        function renderSubject(subj) {
            const container = document.getElementById(`content-${subj}`);
            let html = `<div class="mb-8"><h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">${subj}</h2></div>`;
            
            html += `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">`;

            prioritiesOrder.forEach(prio => {
                if (!syllabus[subj][prio]) return;
                
                syllabus[subj][prio].forEach(chap => {
                    const meta = priorityMeta[prio];
                    const chDone = getChapterProgress(subj, chap);
                    const chPct = Math.round((chDone / tasks.length) * 100);
                    const isComplete = chDone === tasks.length;
                    const cardBg = isComplete ? 'bg-indigo-50 border-indigo-200' : 'bg-white border-gray-200 hover:border-indigo-300 hover:shadow-md';

                    let tasksHtml = '';
                    tasks.forEach(t => {
                        const checked = appState.progress[subj][chap][t] ? 'checked' : '';
                        tasksHtml += `
                            <label class="flex items-center gap-2.5 p-1.5 hover:bg-gray-100 rounded-md cursor-pointer group transition-colors">
                                <input type="checkbox" class="checkbox-custom rounded" ${checked} onchange="toggleTask('${subj}','${chap}','${t}',this)">
                                <span class="text-sm font-medium text-gray-600 group-hover:text-gray-900 ${checked ? 'line-through opacity-60' : ''}">${t}</span>
                            </label>
                        `;
                    });

                    html += `
                        <div class="${cardBg} rounded-2xl p-5 border transition-all duration-300 flex flex-col">
                            <div class="flex justify-between items-start mb-3 gap-2">
                                <h3 class="font-bold text-gray-900 text-lg leading-tight flex-grow">${chap}</h3>
                                <span class="whitespace-nowrap px-2 py-1 rounded text-[10px] font-bold uppercase tracking-wider border shadow-sm ${meta.colors}">${prio}</span>
                            </div>
                            
                            <div class="mb-4">
                                <div class="flex justify-between text-xs font-bold text-gray-500 mb-1">
                                    <span>Progress</span>
                                    <span class="chapter-progress-text">${chDone}/${tasks.length}</span>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-1.5">
                                    <div class="${meta.bar} h-1.5 rounded-full transition-all duration-500 chapter-progress-bar" style="width: ${chPct}%"></div>
                                </div>
                                <div class="chapter-urgency-text mt-1.5 text-[11px] font-semibold text-indigo-500">${getUrgencyLabel({ subj, chap, prio })}</div>
                            </div>
                            
                            <div class="mt-auto grid grid-cols-2 gap-x-2 gap-y-1 pt-3 border-t border-gray-100">
                                ${tasksHtml}
                            </div>
                        </div>
                    `;
                });
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        function renderDaily() {
            const container = document.getElementById('content-Daily');
            let tasksHtml = '';
            let dDone = 0;
            const dTotal = Object.keys(appState.daily.tasks).length;

            for (const t in appState.daily.tasks) {
                const checked = appState.daily.tasks[t];
                if (checked) dDone++;
                
                tasksHtml += `
                    <label class="flex items-center p-4 bg-white border ${checked ? 'border-indigo-200 bg-indigo-50/30' : 'border-gray-200'} rounded-xl cursor-pointer hover:shadow-sm transition-all group mb-3">
                        <input type="checkbox" class="checkbox-custom rounded" ${checked ? 'checked' : ''} onchange="toggleDaily('${t}',this)">
                        <span class="ml-4 text-lg font-medium ${checked ? 'text-gray-400 line-through' : 'text-gray-700 group-hover:text-indigo-900'}">${t}</span>
                    </label>
                `;
            }

            container.innerHTML = `
                <div class="max-w-2xl mx-auto">
                    <div class="text-center mb-8">
                        <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight mb-2">Daily Consistency</h2>
                        <p class="text-gray-500 font-medium">These tasks reset automatically every midnight. Date: ${appState.daily.lastDate}</p>
                    </div>
                    
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 mb-8">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-sm font-bold text-gray-500 uppercase">Today's Goals</span>
                            <span class="text-indigo-600 font-bold">${dDone}/${dTotal} Done</span>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-3 mb-6">
                            <div class="bg-indigo-500 h-3 rounded-full transition-all duration-500" style="width: ${(dDone/dTotal)*100}%"></div>
                        </div>
                        ${tasksHtml}
                    </div>
                </div>
            `;
        }

        window.toggleTask = function(subj, chap, task, el) {
            appState.progress[subj][chap][task] = el.checked;
            refreshChapterUrgency(el.closest('.rounded-2xl'), subj, chap);
            
            const chDone = getChapterProgress(subj, chap);
            const card = el.closest('.rounded-2xl');
            const progressText = card.querySelector('.chapter-progress-text');
            const progressBar = card.querySelector('.chapter-progress-bar');
            const labelSpan = el.nextElementSibling;
            
            if (progressText) progressText.textContent = `${chDone}/${tasks.length}`;
            if (progressBar) progressBar.style.width = `${Math.round((chDone/tasks.length)*100)}%`;
            
            if(el.checked) {
                labelSpan.classList.add('line-through', 'opacity-60');
                if(chDone === tasks.length) {
                    card.classList.add('bg-indigo-50', 'border-indigo-200');
                    card.classList.remove('bg-white');
                }
            } else {
                labelSpan.classList.remove('line-through', 'opacity-60');
                card.classList.remove('bg-indigo-50', 'border-indigo-200');
                card.classList.add('bg-white');
            }

            const stats = calculateStats();
            document.getElementById('overall-progress-bar').style.width = `${stats.pct}%`;
            document.getElementById('overall-progress-text').textContent = `${stats.pct}%`;

            scheduleSave();
        };

        window.toggleDaily = function(task, el) {
            appState.daily.tasks[task] = el.checked;
            renderDaily(); 
            scheduleSave();
        };

        window.switchTab = function(tabName) {
            ['Physics', 'Chemistry', 'Mathematics', 'Daily'].forEach(tab => {
                const btn = document.getElementById(`tab-${tab}`);
                const content = document.getElementById(`content-${tab}`);
                
                if (tab === tabName) {
                    btn.classList.add('tab-active');
                    btn.classList.remove('text-gray-500', 'hover:text-gray-700', 'border-transparent', 'hover:border-gray-300');
                    content.classList.remove('hidden');
                } else {
                    btn.classList.remove('tab-active');
                    btn.classList.add('text-gray-500', 'hover:text-gray-700', 'border-transparent', 'hover:border-gray-300');
                    content.classList.add('hidden');
                }
            });
        };

        // ===================== URGENCY ALGORITHM START =====================
        // Urgency Score = Priority Multiplier × Task Weight × Weakness Multiplier × Due Factor
        //
        // Everything adjustable lives in URGENCY_CONFIG. Task order is the existing `tasks`
        // array (Lecture → Module → PYQs → Revision); the FIRST unchecked task in that order
        // decides the task weight, even if the UI lets boxes be ticked independently.
        const URGENCY_CONFIG = {
            // Fallback for unknown / missing priority values: treated like P3 (neutral, 1.0).
            defaultPriorityMultiplier: 1.0,
            priorityMultipliers: { 'P1': 1.5, 'P2': 1.25, 'P3': 1.0, 'P4': 0.8 },
            // Keys must match the task names in `tasks`.
            taskWeights: { 'Lecture': 4, 'Module': 3, 'PYQs': 4, 'Revision': 2 },
            // Revision due factors. Only used if a chapter ever carries a `revisionStatus`
            // field ('dueSoon' | 'overdue'). Nothing sets it today (see getDueFactor).
            dueFactors: { normal: 1.0, dueSoon: 1.2, overdue: 1.4 },
            maxDueFactor: 1.4
        };

        const hasOwn = (obj, key) => Object.prototype.hasOwnProperty.call(obj, key);

        // Checkbox state for one chapter. Missing chapter/task entries count as "not done".
        function getChapterTaskState(chapter, progressData = appState.progress) {
            return (progressData && progressData[chapter.subj] && progressData[chapter.subj][chapter.chap]) || {};
        }

        function getPriorityMultiplier(chapter) {
            const prio = chapter ? chapter.prio : undefined;
            const map = URGENCY_CONFIG.priorityMultipliers;
            return (typeof prio === 'string' && hasOwn(map, prio) && Number.isFinite(map[prio]))
                ? map[prio]
                : URGENCY_CONFIG.defaultPriorityMultiplier;
        }

        // First unchecked task in checkbox order, or null when every task is complete.
        function getFirstIncompleteTask(chapter, progressData = appState.progress) {
            const state = getChapterTaskState(chapter, progressData);
            for (const t of tasks) {
                if (!state[t]) return t;
            }
            return null;
        }

        function getTaskWeight(task) {
            const map = URGENCY_CONFIG.taskWeights;
            return (typeof task === 'string' && hasOwn(map, task) && Number.isFinite(map[task])) ? map[task] : 0;
        }

        // WEAKNESS TRACKING IS NOT IMPLEMENTED YET.
        // The app stores no weakness, accuracy or mock-test data, so this always returns 1.0.
        // When weakness data exists, derive the multiplier from it here; nothing else needs to change.
        function getWeaknessMultiplier(chapter) {
            return 1.0;
        }

        // REVISION DUE-DATE TRACKING IS NOT IMPLEMENTED YET.
        // The app stores no revision dates/timestamps, so every chapter currently gets 1.0.
        // Once scheduling exists, have it set chapter.revisionStatus ('dueSoon' | 'overdue')
        // (or replace this lookup with real date logic). The result is capped at maxDueFactor.
        function getDueFactor(chapter) {
            const f = URGENCY_CONFIG.dueFactors;
            const status = chapter ? chapter.revisionStatus : undefined;
            const factor = (typeof status === 'string' && hasOwn(f, status)) ? f[status] : f.normal;
            return Math.min(factor, URGENCY_CONFIG.maxDueFactor);
        }

        function isChapterComplete(chapter, progressData = appState.progress) {
            return getFirstIncompleteTask(chapter, progressData) === null;
        }

        // Returns 0 for completed chapters (they are excluded from the queue, data is untouched).
        function calculateUrgencyScore(chapter, progressData = appState.progress) {
            const firstIncomplete = getFirstIncompleteTask(chapter, progressData);
            if (firstIncomplete === null) return 0;
            return getPriorityMultiplier(chapter)
                * getTaskWeight(firstIncomplete)
                * getWeaknessMultiplier(chapter)
                * getDueFactor(chapter);
        }

        // Returns a NEW array of active (incomplete) chapters, most urgent first. Inputs are not mutated.
        // Ties: 1) higher priority multiplier  2) earlier task in sequence  3) original chapter order.
        function sortChaptersByUrgency(chapters, progressData = appState.progress) {
            const scored = [];
            chapters.forEach((ch, i) => {
                const firstIncomplete = getFirstIncompleteTask(ch, progressData);
                if (firstIncomplete === null) return; // complete: leaves the active queue
                scored.push({
                    ...ch,
                    firstIncomplete,
                    score: calculateUrgencyScore(ch, progressData),
                    _order: Number.isFinite(ch.originalIndex) ? ch.originalIndex : i
                });
            });

            return scored.sort((a, b) => {
                if (Math.abs(b.score - a.score) > 1e-9) return b.score - a.score;
                const pa = getPriorityMultiplier(a), pb = getPriorityMultiplier(b);
                if (pa !== pb) return pb - pa;
                const ta = tasks.indexOf(a.firstIncomplete), tb = tasks.indexOf(b.firstIncomplete);
                if (ta !== tb) return ta - tb;
                return a._order - b._order;
            });
        }
        // ====================== URGENCY ALGORITHM END ======================

        // All chapters in their original order (priority tier, then subject, then syllabus order).
        function getAllChapters() {
            const list = [];
            let originalIndex = 0;
            for (const prio of prioritiesOrder) {
                for (const subj of ['Physics', 'Chemistry', 'Mathematics']) {
                    if (!syllabus[subj] || !syllabus[subj][prio]) continue;
                    for (const chap of syllabus[subj][prio]) {
                        list.push({ subj, prio, chap, originalIndex: originalIndex++ });
                    }
                }
            }
            return list;
        }

        function getUrgencyQueue() {
            return sortChaptersByUrgency(getAllChapters(), appState.progress);
        }

        function getUrgencyLabel(chapter) {
            return isChapterComplete(chapter)
                ? '✓ Complete'
                : `Urgency ${calculateUrgencyScore(chapter).toFixed(2)} · next: ${getFirstIncompleteTask(chapter)}`;
        }

        function getChapterPriority(subj, chap) {
            for (const prio in syllabus[subj]) {
                if (syllabus[subj][prio].includes(chap)) return prio;
            }
            return undefined;
        }

        // Called on every checkbox change so the card's score reflects the new first incomplete task.
        function refreshChapterUrgency(card, subj, chap) {
            const el = card && card.querySelector('.chapter-urgency-text');
            if (el) el.textContent = getUrgencyLabel({ subj, chap, prio: getChapterPriority(subj, chap) });
        }

        // ================= SUBJECT-BALANCED RECOMMENDATIONS START =================
        // Per-subject pick = top of the EXISTING urgency queue (sortChaptersByUrgency) filtered to that subject.
        // Overall pick     = best of the three subject picks by  Adjusted Score = Base Urgency × Subject Balance Factor.
        // The base urgency score is never modified; the factor is applied on top and kept separate.
        const SUBJECTS = ['Physics', 'Chemistry', 'Mathematics'];

        const RECOMMENDATION_CONFIG = {
            // Subject balance factors. Defaults are all 1.0 (no adjustment), so the overall ranking
            // equals the base urgency ranking. The app stores NO study-time / session / timestamp data
            // yet, so nothing is derived from activity. Replace the lookup in getSubjectBalanceFactor()
            // with a rolling-window calculation once real activity data exists (keep it modest, e.g. 0.9–1.15).
            subjectBalance: { 'Physics': 1.0, 'Chemistry': 1.0, 'Mathematics': 1.0 },
            defaultSubjectBalance: 1.0
        };

        function getSubjectBalanceFactor(subj) {
            const map = RECOMMENDATION_CONFIG.subjectBalance;
            return (hasOwn(map, subj) && Number.isFinite(map[subj]) && map[subj] > 0)
                ? map[subj]
                : RECOMMENDATION_CONFIG.defaultSubjectBalance;
        }

        // Fraction of all checkbox tasks ticked in a subject (real checkbox data only).
        function getSubjectCompletionFraction(subj, progressData = appState.progress) {
            let done = 0, total = 0;
            getAllChapters().filter(c => c.subj === subj).forEach(c => {
                const state = getChapterTaskState(c, progressData);
                tasks.forEach(t => { total++; if (state[t]) done++; });
            });
            return total > 0 ? done / total : 1;
        }

        // Reason text uses only facts that exist: priority tier and the next unchecked task.
        function getRecommendationReason(rec) {
            const tier = { 'P1': 'Must-master', 'P2': 'High-priority', 'P3': 'Lower-priority' }[rec.prio] || 'Active';
            const why = {
                'Lecture': 'lecture not yet completed',
                'Module': 'lecture done, module practice is next',
                'PYQs': 'ready for PYQ practice',
                'Revision': 'only revision remains'
            }[rec.firstIncomplete] || 'task pending';
            return `${tier} chapter — ${why}.`;
        }

        // One independent entry per subject. A finished subject is reported as complete, never filled from another subject.
        function getSubjectRecommendations(progressData = appState.progress) {
            const all = getAllChapters();
            return SUBJECTS.map(subj => {
                const queue = sortChaptersByUrgency(all.filter(c => c.subj === subj), progressData);
                if (queue.length === 0) return { subj, complete: true, rec: null };
                const top = queue[0];
                const balanceFactor = getSubjectBalanceFactor(subj);
                const rec = {
                    ...top,
                    baseScore: top.score,
                    balanceFactor,
                    adjustedScore: top.score * balanceFactor
                };
                rec.reason = getRecommendationReason(rec);
                return { subj, complete: false, rec };
            });
        }

        // Overall best among the three subject picks. Deterministic; no randomness.
        // Order: adjusted score → priority multiplier → earlier task in sequence →
        // subject with the lower share of ticked tasks (coverage tie-break) → original chapter order.
        function pickBestOverall(subjectRecs, progressData = appState.progress) {
            const candidates = subjectRecs.filter(s => !s.complete).map(s => ({
                ...s.rec,
                _coverage: getSubjectCompletionFraction(s.subj, progressData)
            }));
            if (candidates.length === 0) return null;
            candidates.sort((a, b) => {
                if (Math.abs(b.adjustedScore - a.adjustedScore) > 1e-9) return b.adjustedScore - a.adjustedScore;
                const pa = getPriorityMultiplier(a), pb = getPriorityMultiplier(b);
                if (pa !== pb) return pb - pa;
                const ta = tasks.indexOf(a.firstIncomplete), tb = tasks.indexOf(b.firstIncomplete);
                if (ta !== tb) return ta - tb;
                if (Math.abs(a._coverage - b._coverage) > 1e-9) return a._coverage - b._coverage;
                return a._order - b._order;
            });
            return candidates[0];
        }

        function getSuggestions(progressData = appState.progress) {
            const subjects = getSubjectRecommendations(progressData);
            return { subjects, best: pickBestOverall(subjects, progressData) };
        }
        // ================== SUBJECT-BALANCED RECOMMENDATIONS END ==================

        window.suggestNextChapter = function() {
            // Recomputed from current checkbox state on every call, so it is always up to date.
            const { subjects, best } = getSuggestions();

            if (!best) {
                alert("Amazing! You have completed the entire syllabus tracking!");
                return;
            }

            const meta = priorityMeta[best.prio] || priorityMeta['P3'];

            const badge = document.getElementById('modal-priority-badge');
            badge.className = `px-2.5 py-0.5 rounded text-xs font-bold shadow-sm ${meta.colors}`;
            badge.textContent = best.prio;
            document.getElementById('modal-subject').textContent = best.subj;
            document.getElementById('modal-chapter-name').textContent = best.chap;
            document.getElementById('modal-reason').textContent =
                `Next: ${best.firstIncomplete}. ${best.reason} Highest adjusted urgency across all three subjects.`;
            document.getElementById('modal-score').textContent = best.adjustedScore.toFixed(2);

            const state = getChapterTaskState(best);
            const missingHtml = tasks.filter(t => !state[t]).map(m => {
                const isNext = m === best.firstIncomplete;
                const cls = isNext
                    ? 'bg-indigo-50 text-indigo-700 border-indigo-200'
                    : 'bg-red-50 text-red-700 border-red-200';
                return `<span class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium border ${cls}">${isNext ? 'Next' : 'Pending'}: ${m}</span>`;
            }).join('');
            document.getElementById('modal-missing-tasks').innerHTML = missingHtml;

            document.getElementById('modal-subject-recs').innerHTML = subjects.map(s => {
                if (s.complete) {
                    return `<div class="flex items-center justify-between rounded-lg border border-green-200 bg-green-50 px-3 py-2">
                        <span class="text-sm font-semibold text-gray-800">${s.subj}</span>
                        <span class="text-xs font-bold text-green-700">✓ Subject complete</span>
                    </div>`;
                }
                const r = s.rec;
                const m = priorityMeta[r.prio] || priorityMeta['P3'];
                const isBest = r.subj === best.subj;
                return `<div class="rounded-lg border ${isBest ? 'border-indigo-300 bg-indigo-50/40' : 'border-gray-200 bg-white'} px-3 py-2">
                    <div class="flex items-center justify-between gap-2">
                        <span class="text-sm font-semibold text-gray-800">${r.subj}${isBest ? ' <span class="text-[10px] font-bold text-indigo-600 uppercase">· Best</span>' : ''}</span>
                        <span class="px-1.5 py-0.5 rounded text-[10px] font-bold border ${m.colors}">${r.prio}</span>
                    </div>
                    <p class="text-sm font-bold text-gray-900">${r.chap} <span class="font-medium text-indigo-600">→ ${r.firstIncomplete}</span></p>
                    <p class="text-xs text-gray-500">${r.reason} Urgency ${r.baseScore.toFixed(2)}.</p>
                </div>`;
            }).join('');

            const w = URGENCY_CONFIG.taskWeights;
            document.getElementById('modal-formula-note').textContent =
                'Chapter urgency = priority × task weight × weakness × due factor, using the first incomplete task ('
                + tasks.map(t => `${t}: ${w[t]}`).join(', ') + '). Overall pick = urgency × subject balance factor '
                + '(currently 1.0 for all subjects; weakness and due factors are also 1.0 as no such data is tracked yet).';

            document.getElementById('suggestion-modal').classList.remove('hidden');
        };

        window.closeModal = function() {
            document.getElementById('suggestion-modal').classList.add('hidden');
        };

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
