<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEE Prep Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
        }
        
        /* Custom scrollbar for a neat look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        .checkbox-custom {
            accent-color: #4f46e5; /* indigo-600 */
            width: 1.125rem;
            height: 1.125rem;
            cursor: pointer;
        }
        
        .tab-active {
            border-bottom: 2px solid #4f46e5;
            color: #4f46e5;
            font-weight: 600;
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col">

    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
                    </svg>
                    <h1 class="text-2xl font-bold text-gray-900 tracking-tight">JEE Prep Tracker</h1>
                </div>
                
                <div class="w-full md:w-1/3">
                    <div class="flex justify-between text-sm font-medium mb-1">
                        <span class="text-gray-500">Overall Progress</span>
                        <span id="overall-progress-text" class="text-indigo-600">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="overall-progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Tabs Navigation -->
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 mt-4">
            <nav class="flex space-x-8" aria-label="Tabs" id="tabs-container">
                <button onclick="switchTab('Physics')" id="tab-Physics" class="tab-active py-2 px-1 text-sm font-medium transition-colors hover:text-indigo-600">Physics</button>
                <button onclick="switchTab('Chemistry')" id="tab-Chemistry" class="text-gray-500 hover:text-gray-700 py-2 px-1 text-sm font-medium transition-colors border-b-2 border-transparent hover:border-gray-300">Chemistry</button>
                <button onclick="switchTab('Mathematics')" id="tab-Mathematics" class="text-gray-500 hover:text-gray-700 py-2 px-1 text-sm font-medium transition-colors border-b-2 border-transparent hover:border-gray-300">Mathematics</button>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8 sm:px-6 lg:px-8">
        
        <!-- Loading Overlay -->
        <div id="loading-overlay" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mb-4"></div>
            <p class="text-gray-600 font-medium">Loading your progress...</p>
        </div>

        <!-- Notification Banner for errors -->
        <div id="error-banner" class="hidden bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6" role="alert">
            <p class="font-bold">Error</p>
            <p id="error-message">Something went wrong.</p>
        </div>

        <!-- Subject Containers -->
        <div id="content-Physics" class="subject-content hidden"></div>
        <div id="content-Chemistry" class="subject-content hidden"></div>
        <div id="content-Mathematics" class="subject-content hidden"></div>

    </main>

    <footer class="bg-white border-t py-6 mt-auto">
        <div class="max-w-6xl mx-auto px-4 text-center text-sm text-gray-500">
            Keep grinding. Consistency is the key to JEE success.
        </div>
    </footer>

    <script type="module">
        // Firebase Imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Environment variables provided by Immersive environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-jee-tracker';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // Checklists items for each chapter
        const tasks = ['Lecture', 'Module', 'DPP', 'PYQs', 'Revision'];
        const priorities = ['P1', 'P2', 'P3'];
        const priorityColors = {
            'P1': 'bg-red-100 text-red-800 border-red-200',
            'P2': 'bg-yellow-100 text-yellow-800 border-yellow-200',
            'P3': 'bg-green-100 text-green-800 border-green-200'
        };

        // Syllabus Data Structure (Grouped by Subject -> Priority -> Chapters)
        const syllabusData = {
            'Physics': {
                'P1': [
                    { name: "Mechanics — Laws of Motion and Friction", weight: "3-4", subtopics: "Newton's Laws, FBD problems, connected bodies, friction on inclines", tip: "Ensure FBD is drawn for every problem; approach errors are most common here" },
                    { name: "Mechanics — Work, Energy and Power", weight: "3-4", subtopics: "Work-energy theorem, conservation of energy, power calculations, spring PE", tip: "Identify energy method vs force method before starting — saves 2+ minutes per problem" },
                    { name: "Rotational Motion", weight: "3-4", subtopics: "Moment of inertia, torque, angular momentum conservation, rolling without slipping", tip: "Rolling condition v = ωr is tested in almost every paper; master it cold" },
                    { name: "Current Electricity", weight: "3-5", subtopics: "Kirchhoff's laws, Wheatstone bridge, resistivity, potentiometer, meter bridge", tip: "Highest question count in Physics across recent sessions — treat as non-negotiable" },
                    { name: "Electrostatics", weight: "3-4", subtopics: "Coulomb's law, electric field, potential, capacitors, Gauss's law", tip: "Capacitor charging/discharging combinations appear in nearly every session" },
                    { name: "Modern Physics", weight: "3-4", subtopics: "Photoelectric effect, Bohr's model, radioactive decay, nuclear reactions", tip: "Energy level transitions and half-life calculations are highly predictable question types" }
                ],
                'P2': [
                    { name: "Optics — Ray and Wave", weight: "2-3", subtopics: "Mirrors, lenses, refraction, interference, diffraction, polarisation", tip: "Lens maker's equation and YDSE path difference are the two highest-yield subtopics" },
                    { name: "Magnetism and Moving Charges", weight: "2-3", subtopics: "Lorentz force, circular motion in magnetic field, Biot-Savart, Ampere's law", tip: "Velocity selector and mass spectrometer appear frequently" },
                    { name: "EMI and AC Circuits", weight: "2-3", subtopics: "Faraday's law, Lenz's law, LCR circuits, resonance, transformer", tip: "LCR resonance condition and phase difference are highly predictable" },
                    { name: "SHM and Oscillations", weight: "2", subtopics: "Displacement-velocity-acceleration phase, energy in SHM, pendulum", tip: "Conceptual questions on phase relationships are the most common JEE Mains type" },
                    { name: "Waves and Sound", weight: "2", subtopics: "Transverse and longitudinal waves, standing waves, beats, Doppler effect", tip: "Doppler effect and beats are the highest-yield subtopics" }
                ],
                'P3': [
                    { name: "Gravitation", weight: "1-2", subtopics: "Gravitational potential energy, orbital velocity, escape velocity, Kepler's laws", tip: "One formula-application question almost every paper — do not leave it unrevised" },
                    { name: "Thermodynamics and Kinetic Theory", weight: "1-2", subtopics: "First and second law, heat engines, efficiency, degrees of freedom", tip: "Efficiency of heat engines and gas law combined questions appear regularly" },
                    { name: "Fluid Mechanics", weight: "1-2", subtopics: "Bernoulli's equation, continuity, Archimedes' principle, viscosity", tip: "Buoyancy combination problems are a JEE favourite" },
                    { name: "Semiconductors", weight: "1-2", subtopics: "Logic gates, diodes, transistors", tip: "Make sure to cover basic NCERT logic gates" }
                ]
            },
            'Chemistry': {
                'P1': [
                    { name: "Organic Chemistry — Basic Concepts and GOC", weight: "2-3", subtopics: "Hybridisation, inductive and mesomeric effects, acidic/basic strength, resonance structures", tip: "GOC understanding directly affects ability to answer all other Organic questions" },
                    { name: "Organic Chemistry — Functional Groups and Named Reactions", weight: "3-5", subtopics: "Aldehydes/Ketones/Carboxylic Acids, Amines, Haloalkanes", tip: "Highest Organic Chemistry question count — master product prediction and named reaction patterns" },
                    { name: "Chemical Bonding and Molecular Structure", weight: "2-3", subtopics: "VSEPR, hybridisation, bond order, dipole moment, VBT and MOT", tip: "Bond order and magnetic properties of diatomic molecules appear in almost every session" },
                    { name: "Coordination Chemistry", weight: "2-3", subtopics: "IUPAC naming, isomerism, crystal field theory, EAN rule, stability", tip: "IUPAC naming and magnetic moment calculations are the two most predictable question types" },
                    { name: "Equilibrium — Chemical and Ionic", weight: "2-3", subtopics: "ICE table, Kp/Kc/Kx relationships, buffer solutions, hydrolysis, solubility product", tip: "ICE table calculations and buffer pH are high-frequency and directly improvable" },
                    { name: "p-Block Elements — Groups 13 to 18", weight: "2-3", subtopics: "Properties of oxides, halides, hydrides; anomalous behaviour", tip: "Pure NCERT-based questions — every line of NCERT p-Block is potential JEE material" }
                ],
                'P2': [
                    { name: "Electrochemistry", weight: "2-3", subtopics: "Nernst equation, EMF calculation, cell notation, Faraday's laws, kohlrausch's law", tip: "EMF calculations from electrode potentials appear with high regularity" },
                    { name: "Chemical Kinetics", weight: "2", subtopics: "Rate law, integrated rate equations, half-life, Arrhenius equation", tip: "Order from experimental data and Arrhenius activation energy questions are most common" },
                    { name: "Thermodynamics and Thermochemistry", weight: "2", subtopics: "Hess's law, entropy, Gibbs free energy, bond enthalpy", tip: "ΔG = ΔH − TΔS equilibrium condition questions appear in most sessions" },
                    { name: "Mole Concept and Stoichiometry", weight: "2", subtopics: "Limiting reagent, percentage composition, empirical formula", tip: "Stoichiometry with limiting reagent is the most common calculation type" },
                    { name: "Atomic Structure", weight: "2", subtopics: "Bohr's model, de Broglie wavelength, Heisenberg uncertainty, quantum numbers", tip: "Quantum number permissibility questions appear almost every session" },
                    { name: "d-Block and f-Block Elements", weight: "1-2", subtopics: "Electronic configuration, oxidation states, colour, magnetic moment, KMnO₄ and K₂Cr₂O₇", tip: "KMnO₄ reactions and colour of transition metal ions are highly predictable" }
                ],
                'P3': [
                    { name: "Solutions and Colligative Properties", weight: "1-2", subtopics: "Raoult's law, depression of freezing point, elevation of boiling point, osmotic pressure", tip: "Elevation/depression calculations with i factor appear regularly" },
                    { name: "Polymers and Biomolecules", weight: "1-2", subtopics: "Classification of polymers, types of biomolecules, reducing/non-reducing sugars", tip: "Pure factual NCERT questions — one careful NCERT read is sufficient" },
                    { name: "Surface Chemistry and Environmental Chemistry", weight: "1-2", subtopics: "Adsorption, colloids, pollution", tip: "Read NCERT thoroughly for factual questions" }
                ]
            },
            'Mathematics': {
                'P1': [
                    { name: "Integration — Definite and Indefinite", weight: "3-5", subtopics: "Integration by parts, substitution, limits of definite integrals, area under curves", tip: "Highest question count in Mathematics — master standard forms and the ILATE rule cold" },
                    { name: "Conic Sections — Parabola, Ellipse, Hyperbola", weight: "3-4", subtopics: "Tangent and normal equations, chord of contact, locus of midpoint", tip: "T = 0 shortcut for tangent equations works for all three conics — learn once, use everywhere" },
                    { name: "Probability", weight: "3-4", subtopics: "Bayes' theorem, conditional probability, binomial distribution, expected value", tip: "Bayes' theorem and binomial distribution together cover most JEE Probability questions" },
                    { name: "Matrices and Determinants", weight: "3-4", subtopics: "Determinant evaluation, inverse matrix, system of equations, Cayley-Hamilton theorem", tip: "Consistency of system of equations and adjoint/inverse of 3×3 matrices are most tested" },
                    { name: "Limits, Continuity and Differentiability", weight: "2-3", subtopics: "L'Hopital's rule, sandwich theorem, continuity of piecewise functions", tip: "Piecewise function continuity/differentiability at breakpoints appears in almost every session" },
                    { name: "Differential Equations", weight: "2-3", subtopics: "Variable separable, homogeneous, linear first-order, order and degree", tip: "Variable separable and linear first-order types together cover most JEE DE questions" }
                ],
                'P2': [
                    { name: "Vectors and 3D Geometry", weight: "2-3", subtopics: "Dot and cross product, angle between lines/planes, distance point-to-line", tip: "Distance from point to line/plane and direction cosines are the highest-yield subtopics" },
                    { name: "Complex Numbers", weight: "2", subtopics: "Argand plane locus, modulus-argument form, cube roots of unity, De Moivre's theorem", tip: "Locus problems using |z − a| = r are the most commonly tested Complex Numbers type" },
                    { name: "Quadratic Equations and Inequalities", weight: "2", subtopics: "Nature of roots, Vieta's formulas, location of roots, quadratic inequalities", tip: "Location of roots problems (both roots positive, same sign, etc.) are highly predictable" },
                    { name: "Sequences and Series", weight: "2", subtopics: "AP, GP, AGP, sum of n terms, sum of squares and cubes, telescoping series", tip: "Telescoping series and AGP sum are the two most JEE-specific types — practise both" },
                    { name: "Straight Lines and Circles", weight: "2", subtopics: "Family of lines, distance between parallel lines, relative position of circles", tip: "Family of lines concept reduces multi-step problems to one substitution — master it" },
                    { name: "Application of Derivatives", weight: "2", subtopics: "Increasing/decreasing, maxima/minima, tangent/normal to curve, rate of change", tip: "Maxima/minima using second derivative test and tangent slope questions are most common" }
                ],
                'P3': [
                    { name: "Trigonometry — Functions and Equations", weight: "1-2", subtopics: "Compound angle, general solutions, inverse trig, trigonometric inequalities", tip: "General solution and inverse trig domain/range are the key areas" },
                    { name: "Permutations and Combinations", weight: "1-2", subtopics: "Selection, arrangement, derangement, distribution of identical/distinct objects", tip: "Apply multiplication principle case-by-case — never search for a single formula" },
                    { name: "Binomial Theorem", weight: "1-2", subtopics: "General term, middle term, coefficient of x^n, binomial approximation", tip: "General term and coefficient extraction are predictable — revise the T_{r+1} formula" },
                    { name: "Statistics", weight: "1-2", subtopics: "Mean, variance, standard deviation", tip: "Very scoring and formula-based, ensure you know variance properties" }
                ]
            }
        };

        // User state: stores checked status of tasks
        // Format: userProgress[Subject][Chapter][Task] = boolean
        let userProgress = {};
        let db;
        let auth;
        let currentUserId = null;
        let syncTimeout = null;

        function initEmptyProgress() {
            const newProgress = {};
            for (const subject in syllabusData) {
                newProgress[subject] = {};
                for (const priority in syllabusData[subject]) {
                    syllabusData[subject][priority].forEach(chapter => {
                        newProgress[subject][chapter.name] = {};
                        tasks.forEach(task => {
                            newProgress[subject][chapter.name][task] = false;
                        });
                    });
                }
            }
            return newProgress;
        }

        function calculateStats() {
            let totalTasks = 0;
            let completedTasks = 0;
            
            const subjectStats = {};

            for (const subject in syllabusData) {
                let subjTotal = 0;
                let subjCompleted = 0;
                
                for (const priority in syllabusData[subject]) {
                    syllabusData[subject][priority].forEach(chapter => {
                        tasks.forEach(task => {
                            totalTasks++;
                            subjTotal++;
                            if (userProgress[subject] && userProgress[subject][chapter.name] && userProgress[subject][chapter.name][task]) {
                                completedTasks++;
                                subjCompleted++;
                            }
                        });
                    });
                }
                subjectStats[subject] = {
                    total: subjTotal,
                    completed: subjCompleted,
                    percentage: subjTotal > 0 ? Math.round((subjCompleted / subjTotal) * 100) : 0
                };
            }

            const overallPercentage = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;
            return { overallPercentage, subjectStats };
        }

        function updateProgressBars() {
            const stats = calculateStats();
            
            // Overall
            document.getElementById('overall-progress-bar').style.width = `${stats.overallPercentage}%`;
            document.getElementById('overall-progress-text').textContent = `${stats.overallPercentage}%`;
            
            // Subjects
            for (const subject in stats.subjectStats) {
                const bar = document.getElementById(`progress-bar-${subject}`);
                const text = document.getElementById(`progress-text-${subject}`);
                if (bar && text) {
                    bar.style.width = `${stats.subjectStats[subject].percentage}%`;
                    text.textContent = `${stats.subjectStats[subject].percentage}%`;
                }
            }
        }

        // Handle Checkbox clicks
        window.toggleTask = function(subject, chapter, task, element) {
            if (!userProgress[subject]) userProgress[subject] = {};
            if (!userProgress[subject][chapter]) userProgress[subject][chapter] = {};
            
            userProgress[subject][chapter][task] = element.checked;
            
            updateProgressBars();
            scheduleSave();
        };

        function renderSyllabus() {
            const tabs = ['Physics', 'Chemistry', 'Mathematics'];
            
            tabs.forEach(subject => {
                const container = document.getElementById(`content-${subject}`);
                container.innerHTML = ''; // Clear existing

                // Subject Progress Header
                const headerHtml = `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <h2 class="text-xl font-bold text-gray-800">${subject} Syllabus</h2>
                            <p class="text-sm text-gray-500 mt-1">Track your chapter-wise completion</p>
                        </div>
                        <div class="w-full md:w-64">
                            <div class="flex justify-between text-sm font-medium mb-1">
                                <span class="text-gray-600">Subject Progress</span>
                                <span id="progress-text-${subject}" class="text-indigo-600">0%</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-2">
                                <div id="progress-bar-${subject}" class="bg-indigo-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                `;
                
                let chaptersHtml = '<div class="space-y-8">';
                
                priorities.forEach(priority => {
                    const chapters = syllabusData[subject][priority];
                    if (!chapters || chapters.length === 0) return;
                    
                    const badgeClass = priorityColors[priority];

                    chaptersHtml += `
                        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                            <div class="bg-gray-50 px-6 py-4 border-b border-gray-100 flex items-center gap-3">
                                <h3 class="font-bold text-gray-800 text-lg">${priority} Priority</h3>
                                <span class="text-xs font-semibold px-2.5 py-1 rounded border shadow-sm ${badgeClass}">High Yield Focus</span>
                            </div>
                            <div class="flex flex-col">
                    `;
                    
                    chapters.forEach(chapter => {
                        let tasksHtml = '';
                        tasks.forEach(task => {
                            // Safely check value
                            const isChecked = userProgress[subject] && 
                                              userProgress[subject][chapter.name] && 
                                              userProgress[subject][chapter.name][task];
                            
                            const checkedAttr = isChecked ? 'checked' : '';
                            
                            tasksHtml += `
                                <label class="flex items-center gap-2 cursor-pointer group p-2 -ml-2 hover:bg-indigo-50 rounded-lg transition-colors">
                                    <input type="checkbox" class="checkbox-custom rounded text-indigo-600 focus:ring-indigo-500"
                                        ${checkedAttr}
                                        onchange="toggleTask('${subject}', '${chapter.name}', '${task}', this)">
                                    <span class="text-sm font-medium text-gray-700 group-hover:text-indigo-900 transition-colors">${task}</span>
                                </label>
                            `;
                        });

                        chaptersHtml += `
                            <div class="p-6 flex flex-col gap-4 hover:bg-gray-50/50 transition-colors border-b border-gray-100 last:border-0">
                                <div class="flex flex-wrap justify-between items-start gap-4">
                                    <h4 class="font-bold text-gray-900 text-lg leading-tight md:max-w-xl">${chapter.name}</h4>
                                    <span class="inline-flex items-center px-3 py-1 rounded-md text-xs font-bold bg-indigo-100 text-indigo-800 whitespace-nowrap shadow-sm border border-indigo-200">
                                        Expected: ${chapter.weight} Qs
                                    </span>
                                </div>
                                
                                <p class="text-sm text-gray-600 leading-relaxed">
                                    <span class="font-semibold text-gray-800">Subtopics:</span> ${chapter.subtopics}
                                </p>
                                
                                <div class="bg-amber-50/70 border border-amber-200 rounded-lg p-3 flex gap-3 mt-1">
                                    <span class="text-lg leading-none pt-0.5">💡</span>
                                    <p class="text-sm text-amber-900 leading-snug"><span class="font-bold">Strategy:</span> ${chapter.tip}</p>
                                </div>
                                
                                <div class="flex flex-wrap gap-x-8 gap-y-2 mt-2 pt-4 border-t border-gray-100">
                                    ${tasksHtml}
                                </div>
                            </div>
                        `;
                    });

                    chaptersHtml += `
                            </div>
                        </div>
                    `;
                });
                
                chaptersHtml += '</div>';
                container.innerHTML = headerHtml + chaptersHtml;
            });
            
            // Init with Physics open
            switchTab('Physics');
            updateProgressBars();
        }

        // Tab Switching Logic
        window.switchTab = function(subjectName) {
            const tabs = ['Physics', 'Chemistry', 'Mathematics'];
            
            tabs.forEach(tab => {
                // Update Button styling
                const btn = document.getElementById(`tab-${tab}`);
                if (tab === subjectName) {
                    btn.classList.add('tab-active');
                    btn.classList.remove('text-gray-500', 'hover:text-gray-700', 'border-transparent', 'hover:border-gray-300');
                } else {
                    btn.classList.remove('tab-active');
                    btn.classList.add('text-gray-500', 'hover:text-gray-700', 'border-transparent', 'hover:border-gray-300');
                }
                
                // Update Content visibility
                const content = document.getElementById(`content-${tab}`);
                if (tab === subjectName) {
                    content.classList.remove('hidden');
                } else {
                    content.classList.add('hidden');
                }
            });
        };

        function showError(msg) {
            const banner = document.getElementById('error-banner');
            const msgEl = document.getElementById('error-message');
            msgEl.textContent = msg;
            banner.classList.remove('hidden');
            setTimeout(() => { banner.classList.add('hidden'); }, 5000);
        }

        function hideLoading() {
            document.getElementById('loading-overlay').classList.add('hidden');
        }

        async function loadDataFromFirebase() {
            if (!currentUserId || !db) return;
            
            try {
                // Rule 1 strictly followed: artifacts/{appId}/users/{userId}/{collectionName}
                const docRef = doc(db, 'artifacts', appId, 'users', currentUserId, 'jee_data', 'progress');
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    // Merge saved data with base structure in case syllabus adds new items later
                    userProgress = initEmptyProgress(); 
                    
                    if (data.progress) {
                        for (const subject in data.progress) {
                            for (const chapter in data.progress[subject]) {
                                for (const task in data.progress[subject][chapter]) {
                                    if (userProgress[subject] && userProgress[subject][chapter]) {
                                        userProgress[subject][chapter][task] = data.progress[subject][chapter][task];
                                    }
                                }
                            }
                        }
                    }
                } else {
                    userProgress = initEmptyProgress();
                }
                
                renderSyllabus();
                hideLoading();

            } catch (error) {
                console.error("Error loading data:", error);
                showError("Could not load your saved progress. Showing empty tracker.");
                userProgress = initEmptyProgress();
                renderSyllabus();
                hideLoading();
            }
        }

        // Debounced save to prevent excessive writes
        function scheduleSave() {
            if (syncTimeout) {
                clearTimeout(syncTimeout);
            }
            syncTimeout = setTimeout(() => {
                saveDataToFirebase();
            }, 1000); // 1 second debounce
        }

        async function saveDataToFirebase() {
            if (!currentUserId || !db) return;
            
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', currentUserId, 'jee_data', 'progress');
                await setDoc(docRef, {
                    progress: userProgress,
                    lastUpdated: new Date().toISOString()
                }, { merge: true });
            } catch (error) {
                console.error("Error saving data:", error);
                showError("Failed to save progress to cloud. Changes are only local.");
            }
        }

        // Initialize App
        async function initialize() {
            if (!firebaseConfig) {
                console.warn("No Firebase config provided. Running in local-only mode.");
                userProgress = initEmptyProgress();
                renderSyllabus();
                hideLoading();
                return;
            }

            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // Authentication (Rule 3)
                let user;
                if (initialAuthToken) {
                    const credential = await signInWithCustomToken(auth, initialAuthToken);
                    user = credential.user;
                } else {
                    const credential = await signInAnonymously(auth);
                    user = credential.user;
                }
                
                currentUserId = user.uid;
                await loadDataFromFirebase();
                
            } catch (error) {
                console.error("Firebase init failed:", error);
                showError("Could not connect to database. Operating in local mode.");
                userProgress = initEmptyProgress();
                renderSyllabus();
                hideLoading();
            }
        }

        // Boot
        window.addEventListener('DOMContentLoaded', () => {
            initialize();
        });
    </script>
</body>
</html>
